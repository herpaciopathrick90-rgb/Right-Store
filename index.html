  <!-- 🎨 MAIN CSS -->
<style>

  body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
    transition:0.3s;
  }

  /* 🌙 DARK MODE */
  .dark-mode{

    color:white;
  }

  .dark-mode header{
    background:#000;
  }

  .dark-mode .sidebar,
  .dark-mode .product-card,
  .dark-mode .history-box,
  .dark-mode .cart-sidebar{
    background:#1e1e1e;
    color:white;
  }

  .dark-mode .product-card{
    border:2px solid #ffcc00;
  }

  /* 🌟 HERO SECTION */
  .hero-section{
    height:420px;
    background:
    linear-gradient(
      rgba(0,0,0,0.5),
      rgba(0,0,0,0.5)
    ),
    url('https://images.unsplash.com/photo-1542838132-92c53300491e');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
  }

  .hero-overlay{
    max-width:700px;
    padding:20px;
  }

  .hero-overlay h1{
    font-size:55px;
    margin-bottom:10px;
  }

  .hero-overlay h2{
    font-size:28px;
    margin-bottom:15px;
  }

  .hero-overlay p{
    font-size:18px;
    line-height:1.6;
  }

  .hero-btn{
    margin-top:20px;
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:#ffcc00;
    color:#1565c0;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
  }

  /* 🔵 HEADER */
  header{
    background:#1565c0;
    padding:15px 30px;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:1000;
  }

  .logo-area h2{
    margin:0;
  }

  .header-right{
    display:flex;
    align-items:center;
    gap:15px;
  }

  /* 🔘 BUTTONS */
  .login-btn{
    background:#ffcc00;
    border:none;
    padding:12px 18px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    color:#1565c0;
  }

  /* 🛒 CART */
  .cart-icon{
    position:relative;
    font-size:28px;
    cursor:pointer;
  }

  .cart-count{
    position:absolute;
    top:-10px;
    right:-10px;
    background:red;
    color:white;
    width:22px;

    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;

  /* 🔥 MAIN LAYOUT */
  .store-layout{
    display:flex;
  }

  /* 📂 SIDEBAR */
  .sidebar{
    width:260px;
    background:white;
    min-height:100vh;
    padding:20px;
    border-right:2px solid #eee;
  }

  .categories-box button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#1565c0;
    color:white;
    font-weight:bold;
    cursor:pointer;
  }

  /* 🛍 PRODUCTS AREA */
  .products-side{
    flex:1;
    padding:20px;
  }

  /* 🔥 TABS */
  .tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }

  .tab-btn{
    padding:12px 25px;
    border:none;
    border-radius:12px;
    background:#ddd;
    cursor:pointer;
    font-weight:bold;
  }

  .active-tab{
    background:#1565c0;
    color:white;
  }

  /* 🔍 SEARCH + SORT */
  .top-products-header{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
    align-items:center;
  }

  .top-products-header input,
  #sortSelect{
    padding:12px;
    border-radius:20px;
    border:2px solid #1565c0;
  }

  /* 🛍 GRID */
  .products-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
  }

  /* 🛍 PRODUCT CARD */
  .product-card{
    background:white;
    border-radius:15px;
    padding:15px;
    text-align:center;
    position:relative;
    border:2px solid #1565c0;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
    transition:0.3s;
  }

  .product-card:hover{
    transform:translateY(-5px);
  }

  .product-card img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:10px;
  }

  .best-seller{
    position:absolute;
    top:10px;
    left:10px;
    background:#ffcc00;
    color:#1565c0;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
  }

  .flash-sale{
    position:absolute;
    top:45px;
    left:10px;
    background:red;
    color:white;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
  }

  .price{
    color:#1565c0;
    font-size:20px;
    font-weight:bold;
  }

  .rating{
    color:orange;
  }

  .stock{
    color:green;
    font-weight:bold;
  }

  /* 🔥 QUANTITY */
  .qty-box{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:10px 0;
  }

  .qty-btn{
    width:30px;
    height:30px;
    border:none;
    border-radius:50%;
    background:#1565c0;
    color:white;
    cursor:pointer;
  }

  /* 🔘 BUTTON */
  .add-btn{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:none;
    border-radius:10px;
    background:#ffcc00;
    color:#1565c0;
    font-weight:bold;
    cursor:pointer;
  }

  /* 🛒 CART SIDEBAR */
  .cart-sidebar{
    position:fixed;
    top:0;
    right:-400px;
    width:350px;
    height:100vh;
    background:white;
    padding:20px;
    transition:0.3s;
    overflow:auto;
    z-index:999;
    box-shadow:-5px 0 20px rgba(0,0,0,0.2);
  }

  .cart-sidebar.active{
    right:0;
  }

  /* 📜 HISTORY */
  .history-box{
    background:white;
    padding:20px;
    border-radius:15px;
    border:2px solid #1565c0;
  }

  /* 🔔 TOAST */
  .toast{
    position:fixed;
    top:20px;
    right:20px;
    background:#1565c0;
    color:white;
    padding:15px 20px;
    border-radius:10px;
    display:none;
    z-index:9999;
  }

  /* 📱 MOBILE */
  @media(max-width:768px){

    .store-layout{
      flex-direction:column;
    }

    .sidebar{
      width:auto;
      min-height:auto;
    }

    .hero-overlay h1{
      font-size:38px;
    }

    .hero-overlay h2{
      font-size:22px;
    }

    .header-right{
      margin-top:10px;
      width:100%;
      justify-content:flex-end;
      flex-wrap:wrap;
    }

    .cart-sidebar{
      width:100%;
    }

  }

</style>
</head>

<body>

<!-- 🌟 HERO / WELCOME SECTION -->
<section class="hero-section">

  <div class="hero-overlay">

    <h1>
      Right Wholesale Store
    </h1>

      Online Grocery & Wholesale Store Philippines

      Shop affordable fruits, snacks, drinks,
      and grocery products with fast and easy
      online shopping in the Philippines.
    </p>

    <button
      class="hero-btn"
      onclick="window.scrollTo({
        top:700,
        behavior:'smooth'
      })"
    >
      Shop Now
    </button>

  </div>

</section>

<!-- 🔵 HEADER -->
<header>

  <div class="logo-area">

    <h2>
      🛒 Right Store
    </h2>

  </div>

  <div class="header-right">

    <div id="welcomeUser">
      Welcome 👋
    </div>

    <!-- 🛒 CART -->
    <div
      class="cart-icon"
      onclick="toggleCart()"
    >

      🛒

      <div
        class="cart-count"
        id="cartCount"
      >
        0
      </div>

    </div>

    <!-- 🌙 DARK MODE -->
    <button
      class="login-btn"

    </button>

<!-- 🔔 TOAST -->
<div
  class="toast"
  id="toast"
>
  Added!
</div>

<!-- 🛒 CART SIDEBAR -->
<div
  class="cart-sidebar"
  id="cartSidebar"
>

  <h2>
    Shopping Cart
  </h2>

  <div id="cartItems"></div>

  <h3 id="cartTotal">
    Total: ₱0
  </h3>

  <!-- 🎟️ COUPON -->
  <input
    type="text"
    id="couponInput"
    placeholder="Coupon Code"
    style="
      width:100%;
      padding:12px;
      border-radius:10px;
      border:2px solid #1565c0;
      box-sizing:border-box;
    "
  >

  <button
    class="add-btn"

<!-- 🔥 MAIN STORE -->
<div class="store-layout">

  <!-- 📂 SIDEBAR -->
  <div class="sidebar">

    <h2>
      Categories
    </h2>

    <div class="categories-box">

      <button onclick="filterProducts('all')">
        All
      </button>

      <button onclick="filterProducts('fruits')">
        Fruits
      </button>

      <button onclick="filterProducts('snacks')">
        Snacks
      </button>

      <button onclick="filterProducts('drinks')">
        Drinks
      </button>

    </div>

  </div>

  <!-- 🛍 MAIN CONTENT -->
  <div class="products-side">

    <!-- 🔥 TABS -->
    <div class="tabs">

      <button
        class="tab-btn active-tab"
        onclick="showTab(event,'productsTab')"
      >
        Products
      </button>

      <button
        class="tab-btn"
        onclick="showTab(event,'historyTab')"
      >
        Order History
      </button>

    </div>

    <!-- 🛍 PRODUCTS TAB -->
    <div id="productsTab">

      <div class="top-products-header">

        <input
          type="text"
          id="searchInput"
          placeholder="Search..."
          onkeyup="searchProducts()"
        >

        <!-- 🔥 SORT -->
        <select
          id="sortSelect"
          onchange="sortProducts()"
        >

          <option value="default">
            Sort
          </option>

          <option value="lowHigh">
            Price Low-High
          </option>

          <option value="highLow">
            Price High-Low
          </option>

          <option value="name">
            Name A-Z
          </option>

        </select>

      </div>

      <div
        class="products-grid"
        id="productsContainer"
      ></div>

    </div>

    <!-- 📜 HISTORY TAB -->
    <div
      id="historyTab"
      style="display:none;"
    >

      <div class="history-box">

          Order History
        </h2>

        <div id="historyList"></div>

      </div>

    </div>

  </div>

</div>

<!-- 🚀 JAVASCRIPT -->
<script>

/* 👤 USER */
const currentUser =
localStorage.getItem(
  "username"
);

if(currentUser){

  document.getElementById(
    "welcomeUser"
  ).innerText =
  "Welcome, " +
  currentUser +
  " 👋";

}

/* 🟢 STATE */
let selectedCategory = "all";
let discount = 0;

/* 💾 CART */
let cart =
JSON.parse(
  localStorage.getItem("cart")
) || [];

/* ❤️ WISHLIST */
let wishlist =
JSON.parse(
  localStorage.getItem("wishlist")
) || [];

/* 🛍 PRODUCTS */
let products =
JSON.parse(
  localStorage.getItem("products")
) || [

{
  id:1,
  name:"Apple",
  price:20,
  stock:10,
  category:"fruits",
  image:"https://upload.wikimedia.org/wikipedia/commons/1/15/Red_Apple.jpg",
  rating:"⭐⭐⭐⭐⭐",
  qty:1
},

{
  id:2,
  name:"Banana",
  price:10,
  stock:20,
  category:"fruits",
  image:"https://upload.wikimedia.org/wikipedia/commons/8/8a/Banana-Single.jpg",
  rating:"⭐⭐⭐⭐",
  qty:1
}

];

/* 🔥 TAB SWITCH */
function showTab(event,tabId){

  document.getElementById(
    "productsTab"
  ).style.display = "none";

  document.getElementById(
    "historyTab"
  ).style.display = "none";

  document.getElementById(
    tabId
  ).style.display = "block";

  document
  .querySelectorAll(".tab-btn")
  .forEach(btn => {

    btn.classList.remove(
      "active-tab"
    );

  });

  event.target.classList.add(
    "active-tab"
  );

}
/* 💾 SAVE PRODUCTS */
function saveProducts(){

  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );

}

/* 💾 SAVE CART */
function saveCart(){

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

}

/* 🔥 RENDER PRODUCTS */
function renderProducts(){

  const container =
  document.getElementById(
    "productsContainer"
  );

  const search =
  document.getElementById(
    "searchInput"
  ).value.toLowerCase();

  container.innerHTML = "";

  products
  .filter(product => {

    const matchCategory =
    selectedCategory === "all"
    ||
    product.category === selectedCategory;

    const matchSearch =
    product.name
    .toLowerCase()
    .includes(search);

    return (
      matchCategory &&
      matchSearch
    );

  })

  .forEach(product => {

    const isWishlisted =
    wishlist.includes(product.id);

    container.innerHTML += `

      <div class="product-card">

        <div class="best-seller">
          BEST SELLER
        </div>

        ${product.price < 20 ?

        `<div class="flash-sale">
          FLASH SALE ⚡
        </div>`

        : ""}

        <img src="${product.image}">

        <h3>
          ${product.name}
        </h3>

        <div class="price">
          ₱${product.price}
        </div>

        <div class="rating">
          ${product.rating}
        </div>

        <div class="stock">
          Stock: ${product.stock}
        </div>

        <div class="qty-box">

          <button
            class="qty-btn"
            onclick="decreaseQty(${product.id})"
          >
            -
          </button>

          <span>
            ${product.qty}
          </span>

          <button
            class="qty-btn"
            onclick="increaseQty(${product.id})"
          >
            +
          </button>

        </div>

        <!-- ❤️ WISHLIST -->
        <button
          class="add-btn"
          style="
            background:
            ${isWishlisted ? '#ff4d6d' : 'pink'};
            color:black;
          "
          onclick="toggleWishlist(${product.id})"
        >
          ${isWishlisted ?
          "💖 Wishlisted"
          :
          "❤️ Wishlist"}
        </button>

        <!-- 🛒 CART -->
        <button
          class="add-btn"
          onclick="addToCart(${product.id})"
        >
          Add to Cart
        </button>

      </div>

    `;

  });

}

/* 🔍 SEARCH */
function searchProducts(){

  renderProducts();

}

/* 📂 FILTER */
function filterProducts(category){

  selectedCategory =
  category;

  renderProducts();

}

/* 🔥 SORT */
function sortProducts(){

  const value =
  document.getElementById(
    "sortSelect"
  ).value;

  if(value === "lowHigh"){

    products.sort(
      (a,b)=>
      a.price - b.price
    );

  }

  if(value === "highLow"){

    products.sort(
      (a,b)=>
      b.price - a.price
    );

  }

  if(value === "name"){

    products.sort(
      (a,b)=>
      a.name.localeCompare(
        b.name
      )
    );

  }

  renderProducts();

}

/* ❤️ WISHLIST */
function toggleWishlist(id){

  const existing =
  wishlist.find(
    item => item === id
  );

  if(existing){

    wishlist =
    wishlist.filter(
      item => item !== id
    );

    showToast(
      "Removed from wishlist"
    );

  }else{

    wishlist.push(id);

    showToast(
      "Added to wishlist ❤️"
    );

  }

  localStorage.setItem(
    "wishlist",
    JSON.stringify(wishlist)
  );

  renderProducts();

}

/* ➕ INCREASE QTY */
function increaseQty(id){

  const product =
  products.find(
    p => p.id === id
  );

  if(product.qty < product.stock){

    product.qty++;

  }

  renderProducts();

}

/* ➖ DECREASE QTY */
function decreaseQty(id){

  const product =
  products.find(
    p => p.id === id
  );

  if(product.qty > 1){

    product.qty--;

  }

  renderProducts();

}

/* 🛒 ADD TO CART */
function addToCart(id){

  /* 🔐 LOGIN CHECK */
  const currentUser =
  localStorage.getItem(
    "username"
  );

  if(!currentUser){

    showToast(
      "Please login first"
    );

    setTimeout(() => {

      window.location.href =
      "login.html";

    },1500);

    return;

  }

  /* 🛍 FIND PRODUCT */
  const product =
  products.find(
    p => p.id === id
  );

  /* ❌ OUT OF STOCK */
  if(product.stock <= 0){

    showToast(
      "Out of stock!"
    );

    return;

  }

  /* ❌ PREVENT OVER ORDER */
  if(product.qty > product.stock){

    showToast(
      "Not enough stock!"
    );

    return;

  }

  /* 🛒 CHECK EXISTING */
  const existing =
  cart.find(
    item => item.id === id
  );

  if(existing){

    existing.cartQty +=
    product.qty;

  }else{

    cart.push({

      id:product.id,
      name:product.name,
      price:product.price,
      cartQty:product.qty

    });

  }

  /* 📦 REDUCE STOCK */
  product.stock -=
  product.qty;

  /* 🔄 RESET QTY */
  product.qty = 1;

  /* 💾 SAVE */
  saveProducts();
  saveCart();

  /* 🔄 UPDATE */
  updateCart();
  renderProducts();

  /* 🔔 TOAST */
  showToast(
    product.name +
    " added!"
  );

}

/* 🛒 UPDATE CART */
function updateCart(){

  const cartItems =
  document.getElementById(
    "cartItems"
  );

  cartItems.innerHTML = "";

  let total = 0;
  let totalItems = 0;

  if(cart.length === 0){

    cartItems.innerHTML = `
      <p>
        Cart is empty
      </p>
    `;

  }

  cart.forEach(item => {

    total +=
    item.price *
    item.cartQty;

    totalItems +=
    item.cartQty;

    cartItems.innerHTML += `

      <div class="cart-item">

        <div>

          <strong>
            ${item.name}
          </strong>

          <br>

          Qty:
          ${item.cartQty}

        </div>

        <div>

          ₱${item.price * item.cartQty}

          <br><br>

          <button
            onclick="removeFromCart(${item.id})"
            style="
              background:red;
              color:white;
              border:none;
              padding:5px 10px;
              border-radius:5px;
              cursor:pointer;
            "
          >
            Remove
          </button>

        </div>

      </div>

    `;

  });

  let finalTotal =
  total -
  (total * discount / 100);

  document.getElementById(
    "cartTotal"
  ).innerText =
  "Total: ₱" + finalTotal;

  document.getElementById(
    "cartCount"
  ).innerText =
  totalItems;

}

/* ❌ REMOVE FROM CART */
function removeFromCart(id){

  const item =
  cart.find(
    product => product.id === id
  );

  const storeProduct =
  products.find(
    product => product.id === id
  );

  if(storeProduct){

    storeProduct.stock +=
    item.cartQty;

  }

  cart =
  cart.filter(
    product => product.id !== id
  );

  saveCart();
  saveProducts();

  updateCart();
  renderProducts();

  showToast(
    "Item removed"
  );

}

/* 🎟️ COUPON */
function applyCoupon(){

  const code =
  document.getElementById(
    "couponInput"
  ).value;

  if(code === "SAVE10"){

    discount = 10;

    showToast(
      "10% Discount Applied!"
    );

  }else{

    discount = 0;

    showToast(
      "Invalid Coupon"
    );

  }

  updateCart();

}

/* 🛒 TOGGLE CART */
function toggleCart(){

  document.getElementById(
    "cartSidebar"
  ).classList.toggle(
    "active"
  );

}

/* 💳 CHECKOUT */
function checkout(){

  if(cart.length === 0){

    showToast(
      "Cart is empty!"
    );

    return;

  }

  let history =
  JSON.parse(
    localStorage.getItem(
      "orderHistory"
    )
  ) || [];

  history.push({

    date:new Date()
    .toLocaleString(),

    items:[...cart]

  });

  localStorage.setItem(
    "orderHistory",
    JSON.stringify(history)
  );

  cart = [];

  saveCart();

  updateCart();
  renderHistory();

  showToast(
    "Checkout successful 🎉"
  );

}

/* 📜 HISTORY */
function renderHistory(){

  const historyList =
  document.getElementById(
    "historyList"
  );

  let history =
  JSON.parse(
    localStorage.getItem(
      "orderHistory"
    )
  ) || [];

  historyList.innerHTML = "";

  history.reverse().forEach(order => {

    let itemsHTML = "";

    order.items.forEach(item => {

      itemsHTML += `

        <div>

          ${item.name}
          —
          Qty:
          ${item.cartQty}

        </div>

      `;

    });

    historyList.innerHTML += `

      <div style="
        margin-bottom:20px;
        border-bottom:1px solid #ddd;
        padding-bottom:10px;
      ">

        <strong>
          ${order.date}
        </strong>

        ${itemsHTML}

      </div>

    `;

  });

}

/* 🌙 DARK MODE */
function toggleDarkMode(){

  document.body.classList.toggle(
    "dark-mode"
  );

  localStorage.setItem(
    "darkMode",
    document.body.classList.contains(
      "dark-mode"
    )
  );

}

/* 🌙 LOAD DARK MODE */
if(
  localStorage.getItem(
    "darkMode"
  ) === "true"
){

  document.body.classList.add(
    "dark-mode"
  );

}

/* 🔔 TOAST */
function showToast(message){

  const toast =
  document.getElementById(
    "toast"
  );

  toast.innerText =
  message;

  toast.style.display =
  "block";

  setTimeout(() => {

    toast.style.display =
    "none";

  },2000);

}

/* 🔐 LOGOUT */
function logout(){

  localStorage.removeItem(
    "username"
  );

  localStorage.removeItem(
    "isAdmin"
  );

  window.location.reload();

}

/* 🚀 START */
renderProducts();
updateCart();
renderHistory();

</script>
