}

}

}

.categories-box button{

  margin-top:10px;

  border-radius:10px;

  background:#1565c0;
  color:white;

  font-weight:bold;
  cursor:pointer;

  transition:0.3s;
}

.categories-box button:hover{
  background:#0d47a1;
}

/* 🛍 MAIN PRODUCTS */
.products-side{
  flex:1;
  padding:20px;
}

/* 🔥 TABS */
.tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.tab-btn{
  padding:12px 25px;
  border:none;
  border-radius:12px;
  background:#ddd;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.active-tab{
  background:#1565c0;
  color:white;
}

  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

#sortSelect{
  padding:12px;
  border-radius:20px;
  border:2px solid #1565c0;
}

/* 🛍 PRODUCTS GRID */
.products-grid{
  display:grid;

}

  background:white;
  border-radius:18px;
  padding:15px;

  text-align:center;
  position:relative;

}

.product-card:hover{
  transform:translateY(-5px);
}

  width:160px;
  height:160px;
  object-fit:contain;
  margin-bottom:10px;
}

/* 🏷 LABELS */

  position:absolute;
  top:10px;
  left:10px;

  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

  position:absolute;

  left:10px;

  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.price{
  color:#1565c0;
  font-size:22px;
  font-weight:bold;
}

.rating{

}

.stock{
  color:green;
  font-weight:bold;
}

  gap:10px;

.qty-btn{

  height:32px;

  border-radius:50%;

  background:#1565c0;
  color:white;

  cursor:pointer;
}

.add-btn{
  width:100%;
  padding:12px;
  margin-top:8px;

  border:none;
  border-radius:10px;

  background:#ffcc00;
  color:#1565c0;

  font-weight:bold;
  cursor:pointer;

  transition:0.3s;
}

.add-btn:hover{
  opacity:0.9;
}

/* 🛒 CART SIDEBAR */
.cart-sidebar{
  position:fixed;
  top:0;
  right:-400px;

  width:350px;
  height:100vh;

  background:white;
  padding:20px;

  overflow:auto;

  transition:0.3s;

  z-index:999;

  box-shadow:
  -5px 0 20px rgba(0,0,0,0.2);
}

.cart-sidebar.active{
  right:0;
}

/* 📜 HISTORY */
.history-box{
  background:white;
  padding:20px;

  border-radius:15px;
  border:2px solid #1565c0;
}

/* 🔔 TOAST */
.toast{
  position:fixed;
  top:20px;
  right:20px;

  background:#1565c0;
  color:white;

  padding:15px 20px;

  border-radius:10px;

  display:none;

  z-index:9999;
}

/* 🦶 FOOTER */
.footer{
  background:#1565c0;
  color:white;

  text-align:center;
  padding:30px;

  margin-top:40px;
}

  .sidebar{

  }

  .products-grid{
    grid-template-columns:1fr;
  }

  .top-products-header{

  }

  .header-right{
    width:100%;
    justify-content:center;
    margin-top:10px;
  }

  .cart-sidebar{
    width:100%;
  }

    font-size:38px;
  }

  .hero-overlay h2{
    font-size:22px;
  }

  .hero-overlay p{
    font-size:16px;
  }

}

/* 🔥 TAB SWITCH */
function showTab(event,tabId){

  document.getElementById(
    "productsTab"
  ).style.display = "none";

  document.getElementById(
    "historyTab"
  ).style.display = "none";

  document.getElementById(
    tabId
  ).style.display = "block";

  document
  .querySelectorAll(".tab-btn")
  .forEach(btn => {

    btn.classList.remove(
      "active-tab"
    );

  });

  event.target.classList.add(
    "active-tab"
  );

}
/* 💾 SAVE PRODUCTS */
function saveProducts(){

  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );

}

/* 💾 SAVE CART */
function saveCart(){

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

}

/* 🔥 RENDER PRODUCTS */
function renderProducts(){

  const container =
  document.getElementById(
    "productsContainer"
  );

  const search =
  document.getElementById(
    "searchInput"
  ).value.toLowerCase();

  container.innerHTML = "";

  products
  .filter(product => {

    const matchCategory =
    selectedCategory === "all"
    ||
    product.category === selectedCategory;

    const matchSearch =
    product.name
    .toLowerCase()
    .includes(search);

    return (
      matchCategory &&
      matchSearch
    );

  })

  .forEach(product => {

    const isWishlisted =
    wishlist.includes(product.id);

    container.innerHTML += `

      <div class="product-card">

        <div class="best-seller">
          BEST SELLER
        </div>

        ${product.price < 20 ?

        `<div class="flash-sale">
          FLASH SALE ⚡
        </div>`

        : ""}

        <img src="${product.image}">

        <h3>
          ${product.name}
        </h3>

        <div class="price">
          ₱${product.price}
        </div>

        <div class="rating">
          ${product.rating}
        </div>

        <div class="stock">
          Stock: ${product.stock}
        </div>

        <div class="qty-box">

          <button
            class="qty-btn"
            onclick="decreaseQty(${product.id})"
          >
            -
          </button>

          <span>
            ${product.qty}
          </span>

          <button
            class="qty-btn"
            onclick="increaseQty(${product.id})"
          >
            +
          </button>

        </div>

        <!-- ❤️ WISHLIST -->
        <button
          class="add-btn"
          style="
            background:
            ${isWishlisted ? '#ff4d6d' : 'pink'};
            color:black;
          "
          onclick="toggleWishlist(${product.id})"
        >
          ${isWishlisted ?
          "💖 Wishlisted"
          :
          "❤️ Wishlist"}
        </button>

        <!-- 🛒 CART -->
        <button
          class="add-btn"
          onclick="addToCart(${product.id})"
        >
          Add to Cart
        </button>

      </div>

    `;

  });

}

/* 🔍 SEARCH */
function searchProducts(){

  renderProducts();

}

/* 📂 FILTER */
function filterProducts(category){

  selectedCategory =
  category;

  renderProducts();

}

/* 🔥 SORT */
function sortProducts(){

  const value =
  document.getElementById(
    "sortSelect"
  ).value;

  if(value === "lowHigh"){

    products.sort(
      (a,b)=>
      a.price - b.price
    );

  }

  if(value === "highLow"){

    products.sort(
      (a,b)=>
      b.price - a.price
    );

  }

  if(value === "name"){

    products.sort(
      (a,b)=>
      a.name.localeCompare(
        b.name
      )
    );

  }

  renderProducts();

}

/* ❤️ WISHLIST */
function toggleWishlist(id){

  const existing =
  wishlist.find(
    item => item === id
  );

  if(existing){

    wishlist =
    wishlist.filter(
      item => item !== id
    );

    showToast(
      "Removed from wishlist"
    );

  }else{

    wishlist.push(id);

    showToast(
      "Added to wishlist ❤️"
    );

  }

  localStorage.setItem(
    "wishlist",
    JSON.stringify(wishlist)
  );

  renderProducts();

}

/* ➕ INCREASE QTY */
function increaseQty(id){

  const product =
  products.find(
    p => p.id === id
  );

  if(product.qty < product.stock){

    product.qty++;

  }

  renderProducts();

}

/* ➖ DECREASE QTY */
function decreaseQty(id){

  const product =
  products.find(
    p => p.id === id
  );

  if(product.qty > 1){

    product.qty--;

  }

  renderProducts();

}

/* 🛒 ADD TO CART */
function addToCart(id){

  /* 🔐 LOGIN CHECK */
  const currentUser =
  localStorage.getItem(
    "username"
  );

  if(!currentUser){

    showToast(
      "Please login first"
    );

    setTimeout(() => {

      window.location.href =
      "login.html";

    },1500);

    return;

  }

  /* 🛍 FIND PRODUCT */
  const product =
  products.find(
    p => p.id === id
  );

  /* ❌ OUT OF STOCK */
  if(product.stock <= 0){

    showToast(
      "Out of stock!"
    );

    return;

  }

  /* ❌ PREVENT OVER ORDER */
  if(product.qty > product.stock){

    showToast(
      "Not enough stock!"
    );

    return;

  }

  /* 🛒 CHECK EXISTING */
  const existing =
  cart.find(
    item => item.id === id
  );

  if(existing){

    existing.cartQty +=
    product.qty;

  }else{

    cart.push({

      id:product.id,
      name:product.name,
      price:product.price,
      cartQty:product.qty

    });

  }

  /* 📦 REDUCE STOCK */
  product.stock -=
  product.qty;

  /* 🔄 RESET QTY */
  product.qty = 1;

  /* 💾 SAVE */
  saveProducts();
  saveCart();

  /* 🔄 UPDATE */
  updateCart();
  renderProducts();

  /* 🔔 TOAST */
  showToast(
    product.name +
    " added!"
  );

}

/* 🛒 UPDATE CART */
function updateCart(){

  const cartItems =
  document.getElementById(
    "cartItems"
  );

  cartItems.innerHTML = "";

  let total = 0;
  let totalItems = 0;

  if(cart.length === 0){

    cartItems.innerHTML = `
      <p>
        Cart is empty
      </p>
    `;

  }

  cart.forEach(item => {

    total +=
    item.price *
    item.cartQty;

    totalItems +=
    item.cartQty;

    cartItems.innerHTML += `

      <div class="cart-item">

        <div>

          <strong>
            ${item.name}
          </strong>

          <br>

          Qty:
          ${item.cartQty}

        </div>

        <div>

          ₱${item.price * item.cartQty}

          <br><br>

          <button
            onclick="removeFromCart(${item.id})"
            style="
              background:red;
              color:white;
              border:none;
              padding:5px 10px;
              border-radius:5px;
              cursor:pointer;
            "
          >
            Remove
          </button>

        </div>

      </div>

    `;

  });

  let finalTotal =
  total -
  (total * discount / 100);

  document.getElementById(
    "cartTotal"
  ).innerText =
  "Total: ₱" + finalTotal;

  document.getElementById(
    "cartCount"
  ).innerText =
  totalItems;

}

/* ❌ REMOVE FROM CART */
function removeFromCart(id){

  const item =
  cart.find(
    product => product.id === id
  );

  const storeProduct =
  products.find(
    product => product.id === id
  );

  if(storeProduct){

    storeProduct.stock +=
    item.cartQty;

  }

  cart =
  cart.filter(
    product => product.id !== id
  );

  saveCart();
  saveProducts();

  updateCart();
  renderProducts();

  showToast(
    "Item removed"
  );

}

/* 🎟️ COUPON */
function applyCoupon(){

  const code =
  document.getElementById(
    "couponInput"
  ).value;

  if(code === "SAVE10"){

    discount = 10;

    showToast(
      "10% Discount Applied!"
    );

  }else{

    discount = 0;

    showToast(
      "Invalid Coupon"
    );

  }

  updateCart();

}

/* 🛒 TOGGLE CART */
function toggleCart(){

  document.getElementById(
    "cartSidebar"
  ).classList.toggle(
    "active"
  );

}

/* 💳 CHECKOUT */
function checkout(){

  if(cart.length === 0){

    showToast(
      "Cart is empty!"
    );

    return;

  }

  let history =
  JSON.parse(
    localStorage.getItem(
      "orderHistory"
    )
  ) || [];

  history.push({

    date:new Date()
    .toLocaleString(),

    items:[...cart]

  });

  localStorage.setItem(
    "orderHistory",
    JSON.stringify(history)
  );

  cart = [];

  saveCart();

  updateCart();
  renderHistory();

  showToast(
    "Checkout successful 🎉"
  );

}

/* 📜 HISTORY */
function renderHistory(){

  const historyList =
  document.getElementById(
    "historyList"
  );

  let history =
  JSON.parse(
    localStorage.getItem(
      "orderHistory"
    )
  ) || [];

  historyList.innerHTML = "";

  history.reverse().forEach(order => {

    let itemsHTML = "";

    order.items.forEach(item => {

      itemsHTML += `

        <div>

          ${item.name}
          —
          Qty:
          ${item.cartQty}

        </div>

      `;

    });

    historyList.innerHTML += `

      <div style="
        margin-bottom:20px;
        border-bottom:1px solid #ddd;
        padding-bottom:10px;
      ">

        <strong>
          ${order.date}
        </strong>

        ${itemsHTML}

      </div>

    `;

  });

}

/* 🌙 DARK MODE */
function toggleDarkMode(){

  document.body.classList.toggle(
    "dark-mode"
  );

  localStorage.setItem(
    "darkMode",
    document.body.classList.contains(
      "dark-mode"
    )
  );

}

/* 🌙 LOAD DARK MODE */
if(
  localStorage.getItem(
    "darkMode"
  ) === "true"
){

  document.body.classList.add(
    "dark-mode"
  );

}

/* 🔔 TOAST */
function showToast(message){

  const toast =
  document.getElementById(
    "toast"
  );

  toast.innerText =
  message;

  toast.style.display =
  "block";

  setTimeout(() => {

    toast.style.display =
    "none";

  },2000);

}

/* 🔐 LOGOUT */
function logout(){

  localStorage.removeItem(
    "username"
  );

  localStorage.removeItem(
    "isAdmin"
  );

  window.location.reload();

}

/* 🚀 START */
renderProducts();
updateCart();
renderHistory();
