<!DOCTYPE html>
<html>
<head>
  <title>Advanced Admin Panel</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f5f5f5;
      display:flex;
    }

    /* SIDEBAR */
    .sidebar{
      width:260px;
      background:#0d47a1;
      min-height:100vh;
      color:white;
      padding:20px;
      box-shadow:3px 0 10px rgba(0,0,0,0.2);
    }

    .sidebar h1{
      color:#ffcc00;
      margin-bottom:30px;
    }

    .sidebar button{
      width:100%;
      padding:15px;
      margin-top:15px;
      border:none;
      border-radius:10px;
      background:#ffcc00;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
    }

    .sidebar button:hover{
      transform:scale(1.03);
    }

    /* MAIN */
    .main{
      flex:1;
      padding:30px;
    }

    /* TOPBAR */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
      gap:20px;
    }

    .topbar input{
      width:300px;
      padding:12px;
      border-radius:10px;
      border:2px solid #1565c0;
      outline:none;
    }

    /* DASHBOARD */
    .dashboard{
      display:grid;
      grid-template-columns:
      repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:15px;
      box-shadow:0 3px 10px rgba(0,0,0,0.1);
      border-left:6px solid #1565c0;
    }

    .card h2{
      margin:0;
      color:#1565c0;
      font-size:35px;
    }

    /* FORM */
    .form-box{
      background:white;
      padding:20px;
      border-radius:15px;
      margin-bottom:30px;
      box-shadow:0 3px 10px rgba(0,0,0,0.1);
    }

    .form-box input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:1px solid #ddd;
      box-sizing:border-box;
    }

    .add-btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:10px;
      background:#1565c0;
      color:white;
      font-weight:bold;
      margin-top:15px;
      cursor:pointer;
      transition:0.2s;
    }

    .add-btn:hover{
      background:#0d47a1;
    }

    /* PRODUCTS */
    .products{
      display:grid;
      grid-template-columns:
      repeat(auto-fill,minmax(240px,1fr));
      gap:20px;
    }

    .product-card{
      background:white;
      padding:15px;
      border-radius:15px;
      text-align:center;
      box-shadow:0 3px 10px rgba(0,0,0,0.1);
      position:relative;
      transition:0.3s;
    }

    .product-card:hover{
      transform:translateY(-5px);
    }

    .product-card img{
      width:120px;
      height:120px;
      object-fit:cover;
      border-radius:10px;
    }

    .low-stock{
      background:red;
      color:white;
      padding:5px 10px;
      border-radius:20px;
      font-size:12px;
      position:absolute;
      top:10px;
      left:10px;
    }

    .discount-badge{
      background:#ffcc00;
      color:#1565c0;
      padding:5px 10px;
      border-radius:20px;
      font-size:12px;
      position:absolute;
      top:10px;
      right:10px;
      font-weight:bold;
    }

    .delete-btn{
      background:red;
      color:white;
      border:none;
      padding:10px;
      border-radius:10px;
      cursor:pointer;
      margin-top:10px;
      width:100%;
    }

    .stock-btn{
      background:green;
      color:white;
      border:none;
      padding:10px;
      border-radius:10px;
      cursor:pointer;
      margin-top:10px;
      width:100%;
    }

    /* TABLE */
    table{
      width:100%;
      background:white;
      border-radius:15px;
      overflow:hidden;
      margin-top:30px;
      border-collapse:collapse;
      box-shadow:0 3px 10px rgba(0,0,0,0.1);
    }

    table th{
      background:#1565c0;
      color:white;
      padding:15px;
    }

    table td{
      padding:12px;
      border-bottom:1px solid #ddd;
      text-align:center;
    }

    /* TOAST */
    .toast{
      position:fixed;
      top:20px;
      right:20px;
      background:#1565c0;
      color:white;
      padding:15px 20px;
      border-radius:10px;
      display:none;
      z-index:999;
      font-weight:bold;
      box-shadow:0 5px 15px rgba(0,0,0,0.3);
    }

  </style>
</head>

<body>

<!-- TOAST -->
<div
  class="toast"
  id="toast"
>
  Success
</div>

<!-- SIDEBAR -->
<div class="sidebar">

  <h1>
    🛒 ADMIN PANEL
  </h1>

  <p id="adminName"></p>

  <button onclick="showUsers()">
    👥 View Users
  </button>

  <button onclick="exportProducts()">
    📦 Export Products
  </button>

  <button onclick="clearOrders()">
    🧹 Clear Orders
  </button>

  <button onclick="logout()">
    🚪 Logout
  </button>

</div>

<!-- MAIN -->
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">

    <h1 style="color:#1565c0;">
      Dashboard
    </h1>

    <input
      type="text"
      id="searchInput"
      placeholder="Search products..."
      onkeyup="renderProducts()"
    >

  </div>

  <!-- DASHBOARD -->
  <div class="dashboard">

    <div class="card">
      <h2 id="totalProducts">0</h2>
      <p>Total Products</p>
    </div>

    <div class="card">
      <h2 id="totalOrders">0</h2>
      <p>Total Orders</p>
    </div>

    <div class="card">
      <h2 id="totalSales">₱0</h2>
      <p>Total Sales</p>
    </div>

    <div class="card">
      <h2 id="lowStockCount">0</h2>
      <p>Low Stock Items</p>
    </div>

  </div>

  <!-- ADD PRODUCT -->
  <div class="form-box">

    <h2>Add Product</h2>

    <input
      type="text"
      id="name"
      placeholder="Product Name"
    >

    <input
      type="number"
      id="price"
      placeholder="Price"
    >

    <input
      type="number"
      id="stock"
      placeholder="Stock"
    >

    <input
      type="number"
      id="discount"
      placeholder="Discount %"
    >

    <input
      type="text"
      id="category"
      placeholder="Category"
    >

    <input
      type="text"
      id="image"
      placeholder="Image URL"
    >

    <button
      class="add-btn"
      onclick="addProduct()"
    >
      Add Product
    </button>

  </div>

  <!-- PRODUCTS -->
  <div
    class="products"
    id="productsContainer"
  ></div>

  <!-- ORDERS TABLE -->
  <table>

    <thead>

      <tr>
        <th>Order Date</th>
        <th>Total Items</th>
      </tr>

    </thead>

    <tbody id="ordersTable"></tbody>

  </table>

</div>

<script>

/* ADMIN PROTECTION */
if(
  localStorage.getItem("isAdmin")
  !== "true"
){

  window.location.href =
  "../login.html";

}

/* SHOW ADMIN */
document.getElementById(
  "adminName"
).innerText =
"👋 " +
localStorage.getItem(
  "username"
);

/* DATABASE */
let products =
JSON.parse(
  localStorage.getItem("products")
) || [];

let orders =
JSON.parse(
  localStorage.getItem("orderHistory")
) || [];

let users =
JSON.parse(
  localStorage.getItem("users")
) || [];

/* TOAST */
function showToast(message){

  const toast =
  document.getElementById(
    "toast"
  );

  toast.innerText =
  message;

  toast.style.display =
  "block";

  setTimeout(() => {

    toast.style.display =
    "none";

  },2000);

}

/* RENDER PRODUCTS */
function renderProducts(){

  const container =
  document.getElementById(
    "productsContainer"
  );

  const search =
  document.getElementById(
    "searchInput"
  ).value.toLowerCase();

  container.innerHTML = "";

  let totalSales = 0;

  let lowStock = 0;

  orders.forEach(order=>{

    order.items.forEach(item=>{

      totalSales +=
      item.price *
      item.cartQty;

    });

  });

  products
  .filter(product =>

    product.name
    .toLowerCase()
    .includes(search)

  )

  .forEach((product,index)=>{

    if(product.stock <= 5){
      lowStock++;
    }

    container.innerHTML += `

      <div class="product-card">

        ${
          product.stock <= 5
          ?
          `<div class="low-stock">
            LOW STOCK
          </div>`
          :
          ""
        }

        ${
          product.discount > 0
          ?
          `<div class="discount-badge">
            ${product.discount}% OFF
          </div>`
          :
          ""
        }

        <img src="${product.image}">

        <h3>
          ${product.name}
        </h3>

        <p>
          ₱${product.price}
        </p>

        <p>
          ${product.category}
        </p>

        <p>
          Stock:
          ${product.stock}
        </p>

        <p>
          Discount:
          ${product.discount || 0}%
        </p>

        <button
          class="add-btn"
          onclick="editProduct(${index})"
        >
          Edit Product
        </button>

        <button
          class="stock-btn"
          onclick="restockProduct(${index})"
        >
          Restock +10
        </button>

        <button
          class="delete-btn"
          onclick="deleteProduct(${index})"
        >
          Delete
        </button>

      </div>

    `;

  });

  document.getElementById(
    "totalProducts"
  ).innerText =
  products.length;

  document.getElementById(
    "totalOrders"
  ).innerText =
  orders.length;

  document.getElementById(
    "totalSales"
  ).innerText =
  "₱" + totalSales;

  document.getElementById(
    "lowStockCount"
  ).innerText =
  lowStock;

}

/* ADD PRODUCT */
function addProduct(){

  const name =
  document.getElementById(
    "name"
  ).value;

  const price =
  document.getElementById(
    "price"
  ).value;

  const stock =
  document.getElementById(
    "stock"
  ).value;

  const discount =
  document.getElementById(
    "discount"
  ).value;

  const category =
  document.getElementById(
    "category"
  ).value;

  const image =
  document.getElementById(
    "image"
  ).value;

  if(
    !name ||
    !price ||
    !category ||
    !image
  ){

    showToast(
      "Fill all fields"
    );

    return;

  }

  products.push({

    id:Date.now(),

    name:name,

    price:Number(price),

    stock:Number(stock),

    discount:Number(discount),

    category:category,

    image:image,

    rating:"⭐⭐⭐⭐⭐",

    qty:1

  });

  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );

  renderProducts();

  showToast(
    "Product Added!"
  );

}

/* DELETE */
function deleteProduct(index){

  if(
    confirm(
      "Delete this product?"
    )
  ){

    products.splice(index,1);

    localStorage.setItem(
      "products",
      JSON.stringify(products)
    );

    renderProducts();

    showToast(
      "Deleted!"
    );

  }

}

/* EDIT */
function editProduct(index){

  const product =
  products[index];

  const newName =
  prompt(
    "Edit Name",
    product.name
  );

  const newPrice =
  prompt(
    "Edit Price",
    product.price
  );

  const newStock =
  prompt(
    "Edit Stock",
    product.stock
  );

  const newDiscount =
  prompt(
    "Edit Discount",
    product.discount
  );

  if(newName){
    product.name =
    newName;
  }

  if(newPrice){
    product.price =
    Number(newPrice);
  }

  if(newStock){
    product.stock =
    Number(newStock);
  }

  if(newDiscount){
    product.discount =
    Number(newDiscount);
  }

  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );

  renderProducts();

  showToast(
    "Updated!"
  );

}

/* RESTOCK */
function restockProduct(index){

  products[index].stock += 10;

  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );

  renderProducts();

  showToast(
    "Restocked!"
  );

}

/* USERS */
function showUsers(){

  alert(
    JSON.stringify(
      users,
      null,
      2
    )
  );

}

/* EXPORT */
function exportProducts(){

  console.log(products);

  showToast(
    "Products exported to console"
  );

}

/* CLEAR ORDERS */
function clearOrders(){

  if(
    confirm(
      "Clear all orders?"
    )
  ){

    localStorage.removeItem(
      "orderHistory"
    );

    orders = [];

    renderOrders();

    renderProducts();

    showToast(
      "Orders cleared"
    );

  }

}

/* RENDER ORDERS */
function renderOrders(){

  const table =
  document.getElementById(
    "ordersTable"
  );

  table.innerHTML = "";

  orders.forEach(order => {

    table.innerHTML += `

      <tr>

        <td>
          ${order.date}
        </td>

        <td>
          ${order.items.length}
        </td>

      </tr>

    `;

  });

}

/* LOGOUT */
function logout(){

  localStorage.removeItem(
    "username"
  );

  localStorage.removeItem(
    "isAdmin"
  );

  window.location.href =
  "../login.html";

}

/* START */
renderProducts();
renderOrders();

</script>

</body>
</html>
